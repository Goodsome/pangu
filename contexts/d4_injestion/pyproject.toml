[project]
name = "d4-injestion"
version = "0.1.0"
description = ""
requires-python = ">=3.14"
dependencies = [
    "cv-engine",
    "d4-types",
    "dependency-injector>=4.49.0",
    "foundation",
    "httpx>=0.28.1",
    "opencv-python>=4.14.0",
    "pydantic-settings>=2.14.1",
    "pydantic>=2.13.4",
    "typer>=0.26.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/d4_injestion"]

[tool.pyright]
venvPath = "../../"
venv = ".venv"
include = ["src"]
extraPaths = ["src"]
reportUnusedCallResult = "none"

[tool.uv.sources]
cv-engine = { workspace = true }
d4-types = { workspace = true }
foundation = { workspace = true }
