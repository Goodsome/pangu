[project]
name = "code_structure"
version = "0.1.0"
description = ""
requires-python = ">=3.14"
dependencies = [
    "architecture",
    "code_dom",
    "dependency-injector>=4.49.0",
    "foundation",
    "neo4j>=6.2.0",
    "pydantic>=2.13.4",
    "redis[hiredis]>=5.0",
    "typer>=0.26.7",
    "typing-extensions>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_structure"]

[tool.pyright]
venvPath = "../../"
venv = ".venv"
include = ["src"]
extraPaths = ["src"]
reportUnusedCallResult = "none"

[tool.uv.sources]
architecture = { workspace = true }
code_dom = { workspace = true }
foundation = { workspace = true }
