[project]
name = "d4-leaderboard"
version = "0.1.0"
description = ""
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "d4-types",
    "dependency-injector>=4.49.0",
    "fastapi>=0.141.1",
    "foundation",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.1",
    "pydantic>=2.13.4",
    "redis[hiredis]>=5.0",
    "sqlalchemy[asyncio]>=2.0.50",
    "uvicorn>=0.50.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/d4_leaderboard"]

[tool.pyright]
venvPath = "../../"
venv = ".venv"
include = ["src"]
extraPaths = ["src"]
reportUnusedCallResult = "none"

[tool.uv.sources]
d4-types = { workspace = true }
foundation = { workspace = true }
