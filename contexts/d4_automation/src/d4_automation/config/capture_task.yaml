# ============================================================
# 天梯榜采集任务配置（属于 d4_automation，无坐标信息）
# ============================================================

# 采集目标职业（对应 PlayerClass 枚举名）
player_class: 野蛮人

# 采集页码范围（含首尾页）
start_page: 1
end_page: 100

# 截图输出根目录（相对于运行时工作目录，或填写绝对路径）
output_dir: "output/screenshots"

# ----------------------------------------------------------
# 各操作步骤间的等待时间（秒）
# ----------------------------------------------------------
timing:
  after_select_class: 1.0      # 点击职业按钮后等待榜单刷新
  after_click_row: 0.8         # 点击行后等待弹出菜单出现
  after_open_config: 1.5       # 点击"查看配置"后等待配置页加载
  after_hover_slot: 0.5        # 鼠标悬停槽位后等待 tooltip 渲染
  after_close_config: 0.6      # 关闭配置页后等待回到榜单
  after_next_page: 1.5         # 翻页后等待新页加载

# ----------------------------------------------------------
# 异常重试配置
# ----------------------------------------------------------
retry:
  max_attempts: 3              # 单个操作最大重试次数
  retry_delay: 1.0             # 重试前等待时间（秒）
