[project]
name = "d4-automation"
version = "0.1.0"
description = ""
requires-python = ">=3.14"
dependencies = [
    "d4-client",
    "d4-types",
    "pyyaml>=6.0.2",
    "typer>=0.26.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/d4_automation"]

[tool.pyright]
venvPath = "../../"
venv = ".venv"
include = ["src"]
extraPaths = ["src"]
reportUnusedCallResult = "none"

[tool.uv.sources]
d4-client = { workspace = true }
d4-types = { workspace = true }
