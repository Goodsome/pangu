[project]
name = "architecture"
version = "0.1.0"
description = ""
requires-python = ">=3.14"
dependencies = [
    "dependency-injector>=4.49.0",
    "foundation",
    "neo4j>=6.2.0",
    "pydantic>=2.13.4",
    "redis[hiredis]>=5.0",
    "rich>=15.0.0",
    "typer>=0.26.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/architecture"]

[tool.pyright]
venvPath = "../../"
venv = ".venv"
include = ["src"]
extraPaths = ["src"]
reportUnusedCallResult = "none"

[tool.uv.sources]
foundation = { workspace = true }
