[project]
name = "pangu_mcp"
version = "0.1.0"
description = ""
requires-python = ">=3.14"
dependencies = [
    "dependency-injector>=4.49.0",
    "fastmcp>=3.4.3",
    "foundation",
    "spike",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pangu_mcp"]

[tool.pyright]
venvPath = "../../"
venv = ".venv"
include = ["src"]
extraPaths = ["src"]
reportUnusedCallResult = "none"

[tool.uv.sources]
foundation = { workspace = true }
spike = { workspace = true }
