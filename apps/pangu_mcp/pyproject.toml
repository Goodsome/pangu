[project]
name = "pangu_mcp"
version = "0.1.0"
description = ""
requires-python = ">=3.14"
dependencies = [
    "architecture"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pangu_mcp"]

[tool.pyright]
venvPath = "../../"
venv = ".venv"
include = ["src"]
extraPaths = ["src"]
reportUnusedCallResult = "none"

[tool.uv.sources]
architecture = { workspace = true }