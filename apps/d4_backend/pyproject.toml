[project]
name = "d4-backend"
version = "0.1.0"
description = "D4 Backend FastAPI Server"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "d4-leaderboard",
    "fastapi>=0.141.1",
    "uvicorn>=0.50.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/d4_backend"]

[tool.uv.sources]
d4-leaderboard = { workspace = true }
