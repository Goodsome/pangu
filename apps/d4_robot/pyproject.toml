[project]
name = "d4-robot"
version = "0.1.0"
description = "D4 Robot App"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "d4-automation",
    "typer>=0.26.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/d4_robot"]

[tool.uv.sources]
d4-automation = { workspace = true }
