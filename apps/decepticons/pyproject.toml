[project]
name = "decepticons"
version = "0.1.0"
description = ""
requires-python = ">=3.14"
dependencies = [
    "mhxy-automation",
    "typer>=0.26.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decepticons"]

[tool.pyright]
venvPath = "../../"
venv = ".venv"
include = ["src"]
extraPaths = ["src"]
reportUnusedCallResult = "none"

[tool.uv.sources]
mhxy-automation = { workspace = true }
