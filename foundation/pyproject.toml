[project]
name = "foundation"
version = "0.1.0"
description = ""
requires-python = ">=3.14"
dependencies = [
    "case-converter>=1.2.0",
    "neo4j>=6.2.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "redis[hiredis]>=5.0",
    "sqlalchemy[asyncio]>=2.0.50",
    "typing-extensions>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foundation"]

[tool.pyright]
venvPath = "../"
venv = ".venv"
include = ["src"]
extraPaths = ["src"]
reportUnusedCallResult = "none"
