[project]
name = "vision-stream"
version = "0.1.0"
description = ""
requires-python = ">=3.14"
dependencies = [
    "sys-input",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vision_stream"]

[tool.pyright]
venvPath = "../../"
venv = ".venv"
include = ["src"]
extraPaths = ["src"]
reportUnusedCallResult = "none"

[tool.uv.sources]
sys-input = { workspace = true }
