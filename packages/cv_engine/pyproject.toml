[project]
name = "cv-engine"
version = "0.1.0"
description = ""
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.0.0",
    "opencv-python>=4.14.0",
    "rapidocr-onnxruntime>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cv_engine"]

[tool.pyright]
venvPath = "../../"
venv = ".venv"
include = ["src"]
extraPaths = ["src"]
reportUnusedCallResult = "none"
