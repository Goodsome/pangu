[project]
name = "mhxy-client"
version = "0.1.0"
description = "Fantasy Westward Journey (MHXY) Automation Client"
readme = "README.md"
authors = [
    { name = "Goodsome", email = "xlxmesh@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "sys-input",
    "vision-stream",
    "cv-engine",
    "pydantic>=2.13.4",
    "client-core",
]

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[tool.basedpyright]
reportImportCycles = "none"
