[project]
name = "mhxy-client"
version = "0.1.0"
description = ""
requires-python = ">=3.14"
dependencies = [
    "client-core",
    "cv-engine",
    "pydantic>=2.13.4",
    "sys-input",
    "vision-stream",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mhxy_client"]

[tool.pyright]
venvPath = "../../"
venv = ".venv"
include = ["src"]
extraPaths = ["src"]
reportUnusedCallResult = "none"

[tool.uv.sources]
client-core = { workspace = true }
cv-engine = { workspace = true }
sys-input = { workspace = true }
vision-stream = { workspace = true }
