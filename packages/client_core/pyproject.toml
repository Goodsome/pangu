[project]
name = "client-core"
version = "0.1.0"
description = "Core Client Infrastructure & Window Automation Base (Anti-Corruption Layer)"
readme = "README.md"
authors = [
    { name = "Goodsome", email = "xlxmesh@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "sys-input",
    "vision-stream",
    "cv-engine",
    "foundation",
    "numpy",
    "opencv-python",
]

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[tool.basedpyright]
reportImportCycles = "none"
