[project]
name = "client-core"
version = "0.1.0"
description = ""
requires-python = ">=3.14"
dependencies = [
    "cv-engine",
    "foundation",
    "numpy>=2.0.0",
    "opencv-python>=4.14.0",
    "sys-input",
    "vision-stream",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/client_core"]

[tool.pyright]
venvPath = "../../"
venv = ".venv"
include = ["src"]
extraPaths = ["src"]
reportUnusedCallResult = "none"

[tool.uv.sources]
cv-engine = { workspace = true }
foundation = { workspace = true }
sys-input = { workspace = true }
vision-stream = { workspace = true }
