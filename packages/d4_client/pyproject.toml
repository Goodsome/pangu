[project]
name = "d4-client"
version = "0.1.0"
description = "Diablo IV Automation Client (POM & Game Interaction Engine)"
readme = "README.md"
authors = [
    { name = "Goodsome", email = "xlxmesh@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "sys-input",
    "vision-stream",
    "cv-engine",
    "pyyaml>=6.0.2",
]

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[tool.basedpyright]
# LeaderboardScreen ↔ PlayerConfigScreen 互相返回对方类型（TYPE_CHECKING + 延迟导入规避），
# 属于 POM 双向引用的结构性误报，运行时无循环问题。
reportImportCycles = "none"
