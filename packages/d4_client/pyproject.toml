[project]
name = "d4-client"
version = "0.1.0"
description = ""
requires-python = ">=3.14"
dependencies = [
    "client-core",
    "cv-engine",
    "d4-types",
    "numpy>=2.0.0",
    "opencv-python>=4.14.0",
    "pyyaml>=6.0.2",
    "sys-input",
    "vision-stream",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/d4_client"]

[tool.pyright]
venvPath = "../../"
venv = ".venv"
include = ["src"]
extraPaths = ["src"]
reportUnusedCallResult = "none"

[tool.uv.sources]
client-core = { workspace = true }
cv-engine = { workspace = true }
d4-types = { workspace = true }
sys-input = { workspace = true }
vision-stream = { workspace = true }
