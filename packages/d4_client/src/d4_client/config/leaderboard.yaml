# ============================================================
# D4 天梯榜页面坐标配置
# 所有坐标均为绝对像素坐标，基于游戏窗口左上角为原点。
# 请根据实际游戏分辨率填写准确坐标值。
# ============================================================

# 当前配置基于分辨率（请填写你的实际分辨率）:
# resolution: 1920x1080

leaderboard:
  # ----------------------------------------------------------
  # 榜单记录整体截图区域 [x, y, width, height]
  # 覆盖 10 条记录所在的矩形区域（不含表头）
  # ----------------------------------------------------------
  records_region: [218, 325, 1070, 360]

  # ----------------------------------------------------------
  # 每行记录的鼠标点击坐标（共 10 行，索引 0-9）
  # 用于触发每行的弹出菜单
  # ----------------------------------------------------------
  row_click_points:
    - [750, 348]   # rank 1
    - [750, 382]   # rank 2
    - [750, 415]   # rank 3
    - [750, 449]   # rank 4
    - [750, 484]   # rank 5
    - [750, 518]   # rank 6
    - [750, 553]   # rank 7
    - [750, 587]   # rank 8
    - [750, 621]   # rank 9
    - [750, 654]   # rank 10

  # ----------------------------------------------------------
  # 弹出菜单中"查看配置"按钮定位策略
  #   strategy: "template" 使用图像模板匹配（推荐，适应弹出位置变化）
  #   strategy: "offset"   使用相对行点击坐标的固定偏移
  # ----------------------------------------------------------
  view_config_button:
    strategy: "template"
    template: "templates/view_config_btn.png"   # 相对于本 yaml 所在目录
    # fallback offset（当 template 策略失败时使用）
    offset: [0, 35]

  # ----------------------------------------------------------
  # 翻页按钮坐标（"下一页" ▶ 按钮中心）
  # ----------------------------------------------------------
  next_page_btn: [741, 761]

  # ----------------------------------------------------------
  # 顶部职业选择图标区域 [x, y, width, height] (8 等分: 野蛮人, 死灵法师, 巫师, 游侠, 德鲁伊, 灵巫, 圣骑士, 术士)
  # ----------------------------------------------------------
  class_selector_roi: [150, 70, 580, 45]

  # Legacy 旧定位数据（已废弃，保留仅供参考）
  class_buttons_legacy:
    野蛮人:   [178, 92]
    德鲁伊:   [236, 92]
    法师:     [294, 92]
    游侠:     [350, 92]
    死灵法师: [407, 92]
    盗贼:     [464, 92]
    召唤术士: [521, 92]
    铁血武士: [578, 92]
    虚空使者: [635, 92]
    血骑士:   [692, 92]

  # ----------------------------------------------------------
  # is_visible 检测区域：检查"天梯榜"标题文字
  # ----------------------------------------------------------
  title_roi: [0, 0, 0.2, 0.06]   # 相对比例 [x, y, w, h]，使用 RelativeRegion
  title_text: "天梯榜"

  # ----------------------------------------------------------
  # 页码文字 OCR 区域（如 "1/100"）
  # 位于翻页按钮右侧，请根据实际位置填写
  # ----------------------------------------------------------
  page_number_roi: [760, 750, 100, 30]   # [x, y, w, h] 绝对坐标（估算值，需校准）

  # 每页固定行数
  row_count: 10



# ============================================================
# 玩家配置页坐标配置（点击"查看配置"后进入的页面）
# ============================================================

player_config:
  # ----------------------------------------------------------
  # 关闭配置页按钮（右上角 ✕）
  # ----------------------------------------------------------
  close_btn: [1124, 26]

  # ----------------------------------------------------------
  # tooltip 截图策略
  #   strategy: "fixed_left"  截取左侧固定预览区（推荐）
  #   strategy: "near_cursor" 截取鼠标附近区域
  # ----------------------------------------------------------
  tooltip:
    strategy: "fixed_left"
    fixed_region: [0, 60, 415, 920]     # 左侧固定 tooltip 预览区 [x, y, w, h]
    # near_cursor 备用参数
    cursor_offset: [-320, -60]
    cursor_size: [400, 600]

  # ----------------------------------------------------------
  # 装备槽位悬停坐标（13 个槽位，2 行排列）
  # 第一行（上方 8 个）: 头盔 ~ 戒指2
  # 第二行（下方 5 个）: 主武器 ~ 图腾
