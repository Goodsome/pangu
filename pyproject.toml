[project]
name = "pangu"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "black>=26.5.1",
    "case-converter>=1.2.0",
    "dependency-injector>=4.49.0",
    "event-hub",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "sqlalchemy[asyncio]>=2.0.50",
    "typer>=0.26.7",
]

[dependency-groups]
dev = [
    "ruff>=0.15.16",
]

[project.scripts]
pangu = "apps.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codegen", "apps"]

[tool.pyright]
include = ["src"]
extraPaths = ["src"]
reportUnusedCallResult = "none"

[tool.uv.sources]
event-hub = { path = "../event-hub", editable = true }
