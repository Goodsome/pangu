[project]
name = "pangu"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "architecture",
    "case-converter>=1.2.0",
    "code_dom",
    "code_structure",
    "dependency-injector>=4.49.0",
    "foundation",
    "neo4j>=6.2.0",
    "pangu_cli",
    "pangu_mcp",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "redis[hiredis]>=5.0",
    "sqlalchemy[asyncio]>=2.0.50",
    "typer>=0.26.7",
    "ruff>=0.15.16",
    "d4-leaderboard",
    "code-generation",
    "code-refactoring",
    "code-evolution",
    "vision-stream",
    "sys-input",
    "d4-client",
    "cv-engine",
    "d4-automation",
    "d4-robot",
    "d4-backend",
    "mhxy-client",
    "d4-types",
    "client-core",
]

[project.scripts]
pangu = "pangu_cli.main:main"
pangu_mcp = "pangu_mcp.main:main"
d4-bot = "d4_robot.main:main"
d4-backend = "d4_backend.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
reportUnusedCallResult = "none"
reportImportCycles = "none"

[tool.uv.workspace]
members = ["contexts/*", "apps/*", "foundation", "packages/*"]

[tool.uv.sources]

spike = { workspace = true }
architecture = { workspace = true }
code_structure = { workspace = true }
code_dom = { workspace = true }
foundation = { workspace = true }
pangu_cli = { workspace = true }
pangu_mcp = { workspace = true }
d4-leaderboard = { workspace = true }
code-generation = { workspace = true }
code-refactoring = { workspace = true }
code-evolution = { workspace = true }
vision-stream = { workspace = true }
sys-input = { workspace = true }
d4-client = { workspace = true }
cv-engine = { workspace = true }
d4-automation = { workspace = true }
d4-robot = { workspace = true }
d4-backend = { workspace = true }
mhxy-client = { workspace = true }
d4-types = { workspace = true }
client-core = { workspace = true }


[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "pytest>=9.1.1",
]
