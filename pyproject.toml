[project]
name = "pangu"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "architecture",
    "black>=26.5.1",
    "case-converter>=1.2.0",
    "dependency-injector>=4.49.0",
    "neo4j>=6.2.0",
    "pangu_cli",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "redis[hiredis]>=5.0",
    "sqlalchemy[asyncio]>=2.0.50",
    "typer>=0.26.7",
]

[dependency-groups]
dev = [
    "ruff>=0.15.16",
]

[project.scripts]
pangu = "pangu_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codegen", "apps"]

[tool.pyright]
include = ["src", "contexts"]
extraPaths = [
    "src",
    "contexts/architecture/src",
    "apps/pangu_cli/src",
]
reportUnusedCallResult = "none"

[tool.uv.workspace]
members = ["contexts/*", "apps/*"]

[tool.uv.sources]
architecture = { workspace = true }
pangu_cli = { workspace = true }
