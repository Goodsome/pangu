[project]
name = "pangu"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "architecture",
    "case-converter>=1.2.0",
    "code_dom",
    "code_structure",
    "dependency-injector>=4.49.0",
    "foundation",
    "neo4j>=6.2.0",
    "pangu_cli",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "redis[hiredis]>=5.0",
    "sqlalchemy[asyncio]>=2.0.50",
    "typer>=0.26.7",
    "ruff>=0.15.16",
]

[dependency-groups]
dev = []

[project.scripts]
pangu = "pangu_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codegen", "apps"]

[tool.pyright]
venvPath = "."
venv = ".venv"
# include = ["src", "contexts", "foundation"]
pythonVersion = "3.14"
# extraPaths = [
#     "src",
#     "contexts/architecture/src",
#     "contexts/code_structure/src",
#     "contexts/code_dom/src",
#     "apps/pangu_cli/src",
#     "foundation/src"
# ]
reportUnusedCallResult = "none"

[tool.uv.workspace]
members = ["contexts/*", "apps/*", "foundation"]

[tool.uv.sources]
architecture = { workspace = true }
code_structure = { workspace = true }
code_dom = { workspace = true }
pangu_cli = { workspace = true }
foundation = { workspace = true }
