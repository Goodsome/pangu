[project]
name = "pangu"
version = "0.1.0"
description = "Pangu Monorepo"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "architecture",
    "client-core",
    "code-evolution",
    "code-generation",
    "code-refactoring",
    "code_dom",
    "code_structure",
    "cv-engine",
    "d4-automation",
    "d4-backend",
    "d4-client",
    "d4-injestion",
    "d4-leaderboard",
    "d4-robot",
    "d4-types",
    "decepticons",
    "foundation",
    "mhxy-automation",
    "mhxy-client",
    "pangu_cli",
    "pangu_mcp",
    "spike",
    "sys-input",
    "vision-stream",
]

[project.scripts]
pangu = "pangu_cli.main:main"
pangu_mcp = "pangu_mcp.main:main"
d4-bot = "d4_robot.main:main"
d4-backend = "d4_backend.main:main"
decepticons = "decepticons.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
reportUnusedCallResult = "none"
reportImportCycles = "none"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "foundation/src",
    "contexts/architecture/src",
    "contexts/code_dom/src",
    "contexts/code_structure/src",
    "contexts/code_generation/src",
    "contexts/code_evolution/src",
    "contexts/code_refactoring/src",
    "contexts/d4_automation/src",
    "contexts/d4_injestion/src",
    "contexts/d4_leaderboard/src",
    "contexts/mhxy_automation/src",
    "contexts/spike/src",
    "packages/client_core/src",
    "packages/cv_engine/src",
    "packages/d4_client/src",
    "packages/d4_types/src",
    "packages/mhxy_client/src",
    "packages/sys_input/src",
    "packages/vision_stream/src",
    "apps/d4_backend/src",
    "apps/d4_robot/src",
    "apps/decepticons/src",
    "apps/pangu_cli/src",
    "apps/pangu_mcp/src",
]

[tool.uv.workspace]
members = ["contexts/*", "apps/*", "foundation", "packages/*"]

[tool.uv.sources]
architecture = { workspace = true }
client-core = { workspace = true }
code-evolution = { workspace = true }
code-generation = { workspace = true }
code-refactoring = { workspace = true }
code_dom = { workspace = true }
code_structure = { workspace = true }
cv-engine = { workspace = true }
d4-automation = { workspace = true }
d4-backend = { workspace = true }
d4-client = { workspace = true }
d4-injestion = { workspace = true }
d4-leaderboard = { workspace = true }
d4-robot = { workspace = true }
d4-types = { workspace = true }
decepticons = { workspace = true }
foundation = { workspace = true }
mhxy-automation = { workspace = true }
mhxy-client = { workspace = true }
pangu_cli = { workspace = true }
pangu_mcp = { workspace = true }
spike = { workspace = true }
sys-input = { workspace = true }
vision-stream = { workspace = true }

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "pytest>=9.1.1",
    "ruff>=0.15.16",
]

